<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Exit - Parking Lot Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        #exitResultCard {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .search-input {
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-square-parking me-2 text-primary"></i>ParkManager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="entry.html">Vehicle Entry</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="exit.html">Vehicle Exit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin Panel</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0 d-flex gap-2">
                        <button class="btn btn-outline-light btn-sm" id="darkModeBtn" onclick="toggleDarkMode()" title="Toggle Dark Mode">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <button class="btn btn-outline-light btn-sm flex-grow-1" onclick="logout()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 rounded-3 mb-4">
                    <div class="card-header bg-white py-3 border-bottom-0">
                        <h4 class="mb-0 fw-bold text-secondary">
                            <i class="fa-solid fa-arrow-right-from-bracket me-2 text-danger"></i>Process Vehicle Exit
                        </h4>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <form id="exitForm">
                            <div class="mb-4">
                                <div class="bg-light p-3 rounded-3 text-center border">
                                    <video id="exitCameraFeed" class="w-100 rounded mb-2 shadow-sm" autoplay playsinline muted style="display: none; max-height: 250px; object-fit: cover; background: #000;"></video>
                                    <canvas id="exitCameraCanvas" style="display: none;"></canvas>
                                    <div class="d-flex justify-content-center gap-2">
                                        <button type="button" class="btn btn-outline-danger btn-sm fw-bold" id="exitStartCamBtn" onclick="toggleScanner('exitCameraFeed', 'exitStartCamBtn', 'exitStatusText', 'exitInput', true)">
                                            <i class="fa-solid fa-power-off me-1"></i>Start Auto-Scanner
                                        </button>
                                        <div id="exitStatusText" class="text-danger fw-bold align-self-center ms-2" style="display: none;">
                                            <i class="fa-solid fa-circle-notch fa-spin me-1"></i> Scanning...
                                        </div>
                                    </div>
                                    <div class="form-text mt-2 small text-muted">Point camera clearly at the plate. Focus is critical.</div>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="exitInput" class="form-label text-muted fw-semibold">Enter Token or Number Plate</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                                    <input type="text" class="form-control search-input" id="exitInput" placeholder="e.g. EMP-20231025-001 or MP07AB1234" required autocomplete="off">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm" id="processBtn">
                                Process Exit & Free Slot
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0 rounded-3" id="exitResultCard">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="fa-solid fa-circle-check text-success mb-2" style="font-size: 3rem;"></i>
                            <h4 class="fw-bold">Exit Processed Successfully</h4>
                            <p class="text-muted" id="resPlate">Vehicle Plate</p>
                        </div>
                        
                        <div class="row g-3 bg-light p-3 rounded-3 mb-3">
                            <div class="col-6">
                                <p class="text-muted mb-1 small">Entry Time</p>
                                <h6 id="resEntryTime" class="fw-bold">-</h6>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-1 small">Exit Time</p>
                                <h6 id="resExitTime" class="fw-bold">-</h6>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-1 small">Duration</p>
                                <h6 id="resDuration" class="fw-bold text-primary">-</h6>
                            </div>
                            <div class="col-6">
                                <p class="text-muted mb-1 small">Freed Slot</p>
                                <h6 id="resSlot" class="fw-bold text-success">-</h6>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2 flex-column no-print">
                            <button type="button" class="btn btn-dark w-100" onclick="window.print()">
                                <i class="fa-solid fa-print me-2"></i>Print Receipt
                            </button>
                            <button type="button" class="btn btn-outline-secondary w-100" onclick="resetExitForm()">
                                <i class="fa-solid fa-rotate-right me-2"></i>Process Another Exit
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
