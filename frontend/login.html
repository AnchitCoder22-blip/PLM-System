<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Parking Lot Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
        }
        .brand-panel {
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .forms-panel {
            padding: 3rem;
        }
    </style>
</head>
<body>

    <button class="btn btn-outline-secondary position-absolute top-0 end-0 m-3" id="darkModeBtn" onclick="toggleDarkMode()" title="Toggle Dark Mode" style="z-index: 1000;">
        <i class="fa-solid fa-moon"></i>
    </button>
    <div class="login-container">
        <div class="card login-card">
            <div class="row g-0 h-100">
                
                <div class="col-md-5 brand-panel d-none d-md-flex">
                    <i class="fa-solid fa-square-parking mb-4 text-primary" style="font-size: 5rem;"></i>
                    <h2 class="fw-bold mb-3">ParkManager</h2>
                    <p class="text-white-50">Streamline your parking operations with our seamless management platform.</p>
                </div>
                
                <div class="col-md-7 forms-panel">
                    <h3 class="fw-bold mb-4 text-center">Welcome Back</h3>
                    
                    <ul class="nav nav-pills nav-justified mb-4" id="loginTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="security-tab" data-bs-toggle="pill" data-bs-target="#security" type="button" role="tab" aria-controls="security" aria-selected="true">
                                <i class="fa-solid fa-shield-halved me-2"></i>Security
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin" type="button" role="tab" aria-controls="admin" aria-selected="false">
                                <i class="fa-solid fa-user-tie me-2"></i>Admin
                            </button>
                        </li>
                    </ul>
                    
                    <div class="tab-content" id="loginTabsContent">
                        
                        <div class="tab-pane fade show active" id="security" role="tabpanel" aria-labelledby="security-tab">
                            <div class="text-center py-4">
                                <div class="bg-light rounded-circle d-inline-block p-4 mb-4">
                                    <i class="fa-solid fa-walkie-talkie text-muted" style="font-size: 3rem;"></i>
                                </div>
                                <h5 class="fw-bold mb-3">Security Access</h5>
                                <p class="text-muted small mb-4">Quick access for security personnel to manage vehicle entries and exits.</p>
                                <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" onclick="handleSecurityLogin()">
                                    Login as Security
                                </button>
                            </div>
                        </div>

                        
                        <div class="tab-pane fade" id="admin" role="tabpanel" aria-labelledby="admin-tab">
                            <form onsubmit="handleAdminLogin(event)" class="py-2">
                                <div class="mb-3">
                                    <label for="adminUser" class="form-label fw-semibold text-muted small">Admin ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-0" id="adminUser" placeholder="Enter admin ID" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="adminPass" class="form-label fw-semibold text-muted small">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                        <input type="password" class="form-control border-start-0 ps-0" id="adminPass" placeholder="Enter password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow-sm">
                                    Login to Dashboard
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Need app.js for authentication logic -->
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
