<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lot Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-square-parking me-2 text-primary"></i>ParkManager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="entry.html">Vehicle Entry</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="exit.html">Vehicle Exit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin Panel</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0 d-flex gap-2">
                        <button class="btn btn-outline-light btn-sm" id="darkModeBtn" onclick="toggleDarkMode()" title="Toggle Dark Mode">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <button class="btn btn-outline-light btn-sm flex-grow-1" onclick="logout()">
                            <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-secondary">Dashboard Overview</h2>
            <span class="text-muted"><i class="fa-regular fa-calendar me-2"></i>Today's Status</span>
        </div>

        <div class="row g-4">
            
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-primary-subtle text-primary me-3">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div>
                            <h6 class="card-title text-muted mb-1">Total Slots</h6>
                            <h3 class="fw-bold mb-0" id="totalSlots">80</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-success-subtle text-success me-3">
                            <i class="fa-solid fa-id-badge"></i>
                        </div>
                        <div>
                            <h6 class="card-title text-muted mb-1">Emp. Slots Free</h6>
                            <h3 class="fw-bold mb-0" id="empSlotsFree">124</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-info-subtle text-info me-3">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div>
                            <h6 class="card-title text-muted mb-1">Visitor Slots Free</h6>
                            <h3 class="fw-bold mb-0" id="visSlotsFree">45</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-warning-subtle text-warning me-3">
                            <i class="fa-solid fa-car-side"></i>
                        </div>
                        <div>
                            <h6 class="card-title text-muted mb-1">Active Parkings</h6>
                            <h3 class="fw-bold mb-0" id="activeParkings">331</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="icon-box bg-success-subtle text-success me-3" style="border-color: var(--core-border);">
                            <i class="fa-solid fa-indian-rupee-sign"></i>
                        </div>
                        <div>
                            <h6 class="card-title text-muted mb-1">Revenue Today</h6>
                            <h3 class="fw-bold mb-0" id="dailyRevenue">₹0</h3>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold text-secondary"><i class="fa-solid fa-map-location-dot me-2 text-primary"></i>Live Slot Status</h5>
                        <div class="d-flex gap-3 text-muted small fw-semibold flex-wrap align-items-center">
                            <span><span class="legend-box slot-empty me-1"></span> Empty</span>
                            <span><span class="legend-box slot-emp me-1"></span> Employee (A&B)</span>
                            <span><span class="legend-box slot-vis me-1"></span> Visitor (C&D)</span>
                        </div>
                    </div>
                    <div class="card-body bg-light">
                        <div id="parkingGridContainer" class="d-flex flex-wrap gap-2 justify-content-center">
                            </div>
                    </div>
                </div>
            </div>
        </div>


    <script src="app.js"></script>
</body>
</html>
